name: basir-ai

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-basirai}
      POSTGRES_USER: ${POSTGRES_USER:-basirai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-basirai-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Use the service name "db" as the hostname inside Docker's network.
      # The .env file at the repo root uses "db" as well; this is kept
      # explicit here for clarity and to override any local override.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-basirai}:${POSTGRES_PASSWORD:-basirai-local-only}@db:5432/${POSTGRES_DB:-basirai}
      BACKEND_API_KEY: ${BACKEND_API_KEY:-local-development-key}
      SNAPSHOT_SERVE_DIR: /app/snapshots
    ports:
      - "8000:8000"
    volumes:
      - inference_snapshots:/app/snapshots:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  inference:
    build:
      context: .
      dockerfile: inference/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      CAFE_ID: ${CAFE_ID:-1}
      ROI_CONFIG_PATH: ${ROI_CONFIG_PATH:-/app/inference/config/roi_config.json}
      BACKEND_API_URL: ${BACKEND_API_URL:-http://backend:8000}
      BACKEND_API_KEY: ${BACKEND_API_KEY:-local-development-key}
      BACKEND_REQUEST_TIMEOUT_SECONDS: ${BACKEND_REQUEST_TIMEOUT_SECONDS:-10}
      BACKEND_RETRY_COUNT: ${BACKEND_RETRY_COUNT:-1}
      RTSP_URL: ${RTSP_URL:-}
      DETECTION_INTERVAL_SECONDS: ${DETECTION_INTERVAL_SECONDS:-45}
      MOCK_MODE: ${MOCK_MODE:-true}
      MOCK_FRAME_PATH: ${MOCK_FRAME_PATH:-/app/dataset/mock/workspace.ppm}
      MOCK_VIDEO_PATH: ${MOCK_VIDEO_PATH:-}
      MOCK_VIDEO_LOOP: ${MOCK_VIDEO_LOOP:-true}
      YOLO_PERSON_MODEL_PATH: ${YOLO_PERSON_MODEL_PATH:-/app/models/yolov8n.pt}
      YOLO_PERSON_CLASS_ID: ${YOLO_PERSON_CLASS_ID:-0}
      YOLO_PERSON_CONFIDENCE_THRESHOLD: ${YOLO_PERSON_CONFIDENCE_THRESHOLD:-0.40}
      YOLO_CALIBRATION_MODEL_PATH: ${YOLO_CALIBRATION_MODEL_PATH:-/app/models/table-chair-best.pt}
      YOLO_CALIBRATION_CONFIDENCE_THRESHOLD: ${YOLO_CALIBRATION_CONFIDENCE_THRESHOLD:-0.35}
      YOLO_IOU_THRESHOLD: ${YOLO_IOU_THRESHOLD:-0.45}
      YOLO_IMAGE_SIZE: ${YOLO_IMAGE_SIZE:-640}
      SNAPSHOT_STORAGE_ENABLED: ${SNAPSHOT_STORAGE_ENABLED:-false}
      SNAPSHOT_STORAGE_BACKEND: ${SNAPSHOT_STORAGE_BACKEND:-local}
      SNAPSHOT_DIR: ${SNAPSHOT_DIR:-/app/snapshots}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
    volumes:
      - inference_ultralytics_cache:/app/.config/Ultralytics
      - ${MODEL_DIR:-./local-models}:/app/models:ro
      - ./dataset/mock:/app/dataset/mock:ro
      - inference_snapshots:/app/snapshots

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_CAFE_ID: ${NEXT_PUBLIC_CAFE_ID:-1}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  inference_ultralytics_cache:
  inference_snapshots:
