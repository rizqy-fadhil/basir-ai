name: basir-ai

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-basirai}
      POSTGRES_USER: ${POSTGRES_USER:-basirai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-basirai-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Use the service name "db" as the hostname inside Docker's network.
      # The .env file at the repo root uses "db" as well; this is kept
      # explicit here for clarity and to override any local override.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-basirai}:${POSTGRES_PASSWORD:-basirai-local-only}@db:5432/${POSTGRES_DB:-basirai}
      BACKEND_API_KEY: ${BACKEND_API_KEY}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
